<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Color by Number</title>
    <link rel="stylesheet" href="/static/style.css">

    
</head>
<body>
    <div class="container">
        <h1>Advanced Color by Number Generator</h1>
        
        <label for="imageUpload">Upload Image:</label>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/gif">
        <img id="originalImagePreview" src="#" alt="Original Preview" style="display:none;"/>

        <fieldset class="settings-group">
            <legend>Color & Detail</legend>
            <label for="numColors">Number of Colors (2-32):</label>
            <input type="number" id="numColors" value="8" min="2" max="32">
            
            <label for="lineSensitivity">Line Detail:</label>
            <select id="lineSensitivity">
                <option value="medium" selected>Medium</option>
                <option value="low">Low (Fewer/Bolder Lines)</option>
                <option value="high">High (More/Finer Lines)</option>
            </select>
        </fieldset>

        <fieldset class="settings-group">
            <legend>Numbering</legend>
            <label for="fontSize">Number Font Size (px, e.g., 10-30):</label>
            <input type="number" id="fontSize" value="15" min="8" max="50">
        </fieldset>
        
        <fieldset class="settings-group">
            <legend>Advanced Options</legend>
            <div class="checkbox-group">
                <input type="checkbox" id="mergeSmallRegions" name="mergeSmallRegions">
                <label for="mergeSmallRegions">Merge small regions</label>
            </div>
            <div id="mergeOptions" style="display:none; margin-left: 20px; margin-top: 10px; margin-bottom: 0;">
                <label for="minMergeAreaPercent" style="font-size: 0.9em;" title="Regions smaller than this percentage of the image will be merged.">Min area to keep (% of total):</label>
                <input type="number" id="minMergeAreaPercent" value="0.1" step="0.05" min="0.01" max="5" style="width: 120px; padding: 8px;">
            </div>
        </fieldset>

        <button id="processButton" disabled>Generate Color by Number</button>
        <div class="loader" id="loader"></div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="outputs">
        <div class="output-group" id="quantizedOutput" style="display:none;">
            <h2>Colored Preview</h2>
            <img id="quantizedImage" src="#" alt="Quantized Image">
            <div class="download-buttons">
                <button id="downloadQuantizedPng">Download PNG</button>
            </div>
        </div>

        <div class="output-group" id="bgRemovedOutput" style="display:none;">
            <h2>BG Removed Character</h2>
            <img id="bgRemovedImage" src="#" alt="Background Removed Character">
             <div class="download-buttons">
                <button id="downloadBgRemovedPng">Download PNG</button>
            </div>
        </div>

        <div class="output-group" id="lineArtOutput" style="display:none;">
            <h2>Line Art with Numbers</h2>
            <img id="lineArtImagePng" src="#" alt="Line Art PNG">
            <div class="legend" id="colorLegend"></div>
            <div class="download-buttons">
                <button id="downloadLineArtPng">Download PNG</button>
                <button id="downloadLineArtSvg">Download SVG</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
